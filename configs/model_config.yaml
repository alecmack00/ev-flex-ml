# Deep Learning Model Configuration for ev-flex-ml

# Global System & Execution Settings
seed: 42              # Random seed for PyTorch, NumPy, and Python random for exact reproducibility.
device: "auto"        # Hardware compute target for model execution. (Alternatives: "auto", "cpu", "cuda", "mps")
num_workers: 0        # Number of parallel DataLoader subprocesses. (Alternatives: 0 for main thread/macOS safety, 2, 4, 8 for Linux)

# Mixture Density Network (MDN)
## Predicts joint multimodal probability distribution of session duration (hours) and energy target (kWh).
mdn:
  input_dim: 12       # Dimension of input session feature vector (arrival time encodings, initial SoC, historical driver averages).
  hidden_dims: [64, 128, 64] # Layer widths for MLP feature extractor backbone. (Alternatives: [32, 64, 32] lightweight, [64, 128, 64] standard, [128, 256, 128] high capacity)
  num_mixtures: 5     # Number of Gaussian components (K) in GMM. (Alternatives: 3 simple bi/tri-modal, 5 standard EV behavioral clusters, 7 complex multi-modal)
  output_dim: 2       # Target vector dimension Y = [duration, energy]. (Alternatives: 1 for duration only, 2 for duration & energy, 3 for duration, energy, max power)
  dropout: 0.1        # Dropout rate between MLP backbone layers to prevent overfitting. (Alternatives: 0.0 disabled, 0.1 to 0.3 standard, 0.5 heavy regularization)
  sigma_min: 0.0001   # Standard deviation lower bound floor enforcing positivity and preventing NLL division by zero. (Alternatives: 1e-5, 1e-4, 1e-3)
  learning_rate: 0.001 # Initial Adam/AdamW optimizer step size. (Alternatives: 0.01 aggressive, 0.001 standard default, 0.0001 fine-tuning)
  weight_decay: 0.0001 # L2 weight norm penalty added to loss for regularization. (Alternatives: 0.0 disabled, 1e-5 to 1e-3 standard L2)
  batch_size: 64      # Number of session samples per optimization mini-batch. (Alternatives: 16, 32, 64, 128)
  epochs: 50          # Maximum training iterations over full dataset. (Alternatives: 20 to 200 depending on dataset size)
  patience: 10        # Early stopping tolerance (epochs without validation loss improvement). (Alternatives: 5 aggressive, 10 standard, 20 patient)
  lr_scheduler:
    factor: 0.5       # Multiplicative decay factor applied to LR when validation loss plateaus.
    patience: 3       # Number of stagnant validation epochs before decaying learning rate.
    min_lr: 0.000001  # Lower limit floor for learning rate decay.

# Quantile Temporal Convolutional Network (Quantile TCN)
## Dilated 1D causal convolutions with residual blocks for multi-quantile aggregate load forecasting under Pinball loss.
quantile_tcn:
  input_dim: 8        # Number of multivariate time-series features per step (load, spot prices, time encodings, weather).
  num_channels: [32, 64, 64, 32] # Channel depths for stacked 1D dilated residual convolution blocks. (Alternatives: [16, 32, 32], [32, 64, 64, 32], [64, 128, 128, 64])
  kernel_size: 3      # 1D convolution kernel filter width. (Alternatives: 2, 3 standard causal TCN, 5 for broader local temporal context)
  dropout: 0.15       # Spatial 1D dropout probability inside residual blocks. (Alternatives: 0.05 to 0.3)
  quantiles: [0.1, 0.5, 0.9] # Target forecast percentiles tau under Pinball loss. (Alternatives: [0.5] median only, [0.1, 0.5, 0.9] 80% interval, [0.05, 0.5, 0.95] 90% interval)
  sequence_length: 96 # Lookback window in time steps (96 steps = 24 hours at 15-min resolution dt=0.25h).
  learning_rate: 0.0005 # Initial step size for TCN optimizer. (Alternatives: 0.0001, 0.0005 standard for residual TCN, 0.001)
  weight_decay: 0.0001 # L2 weight regularization penalty. (Alternatives: 0.0 disabled, 1e-5 to 1e-3)
  batch_size: 32      # Mini-batch size for sequence windows. (Alternatives: 16, 32, 64)
  epochs: 40          # Maximum training iterations for TCN. (Alternatives: 20 to 100)
  patience: 8         # Early stopping tolerance in epochs for TCN validation loss. (Alternatives: 5 to 15)
  lr_scheduler:
    factor: 0.5       # Decay multiplier when validation loss plateaus.
    patience: 3       # Stagnant validation epochs before decaying LR.
    min_lr: 0.000001  # Minimum LR floor limit.
